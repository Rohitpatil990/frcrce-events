<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - Event Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <div class="logo"><span class="logo-icon"><img src="../assets/college-logo.jpg" alt="FRCRCE Logo" class="college-logo"></span><span>FRCRCE Events</span></div>
      <nav><ul class="nav-links"><li><a id="dashboardLink">Dashboard</a></li><li class="user-info"><span id="userName" class="user-name"></span><button class="btn btn-secondary btn-small" onclick="utils.logout()">Logout</button></li></ul></nav>
    </div>
  </header>
  <main class="main-content"><div class="container"><div id="eventContainer" class="card"><div class="spinner"></div></div></div></main>
  <script src="../js/api.js"></script>
  <script>
    if (!utils.checkAuth()) throw new Error('Authentication required');
    const user = utils.getUserFromStorage();
    const eventId = new URLSearchParams(location.search).get('id');
    document.getElementById('userName').textContent = user.name;
    document.getElementById('dashboardLink').href = `${user.role}-dashboard.html`;

    async function loadEvent() {
      const container = document.getElementById('eventContainer');
      if (!eventId) {
        container.innerHTML = '<p class="alert alert-error">Event ID is missing.</p>';
        return;
      }
      try {
        const { event, isRegistered } = await eventAPI.getEvent(encodeURIComponent(eventId));
        container.innerHTML = `<div class="card-header"><h1 class="card-title">${utils.escapeHtml(event.title)}</h1><span class="badge badge-info">${utils.escapeHtml(event.status)}</span></div>
          <p><strong>Type:</strong> ${utils.escapeHtml(event.type)}</p>
          <p><strong>Date:</strong> ${utils.escapeHtml(utils.formatDate(event.startDate))} – ${utils.escapeHtml(utils.formatDate(event.endDate))}</p>
          <p><strong>Time:</strong> ${utils.escapeHtml(event.startTime)} – ${utils.escapeHtml(event.endTime)}</p>
          <p><strong>Venue:</strong> ${utils.escapeHtml(event.venue)}</p>
          <p><strong>Resource person:</strong> ${utils.escapeHtml(event.resourcePerson || 'Not specified')}</p>
          <p><strong>Capacity:</strong> ${event.currentRegistrations}/${event.capacity}</p>
          <p><strong>Registration deadline:</strong> ${event.registrationDeadline ? utils.escapeHtml(utils.formatDate(event.registrationDeadline)) : 'Not specified'}</p>
          <hr><p>${utils.escapeHtml(event.description)}</p>
          <div class="mt-3" id="eventActions">
            ${user.role === 'student' && event.status === 'Approved' ? (isRegistered
              ? '<p>You are already registered for this event.</p>'
              : '<button id="registerButton" class="btn btn-primary">Register</button>') : ''}
            ${user.role === 'faculty' ? `<a class="btn btn-primary" href="attendance.html?id=${encodeURIComponent(event._id)}">Manage attendance</a>` : ''}
            ${user.role === 'admin' && event.status === 'Pending' ? '<button class="btn btn-success" id="approveButton">Approve</button> <button class="btn btn-danger" id="rejectButton">Reject</button>' : ''}
          </div>`;
        const registerButton = document.getElementById('registerButton');
        if (registerButton) registerButton.addEventListener('click', async () => {
          registerButton.disabled = true;
          try {
            const result = await registrationAPI.registerForEvent(event._id);
            utils.showAlert(result.message, 'success');
            await loadEvent();
          } catch (error) {
            registerButton.disabled = false;
            utils.showAlert(error.message, 'error');
          }
        });
        for (const status of ['Approved', 'Rejected']) {
          const button = document.getElementById(status === 'Approved' ? 'approveButton' : 'rejectButton');
          if (button) button.addEventListener('click', async () => {
            try {
              await eventAPI.approveEvent(event._id, { status, adminRemarks: '' });
              await loadEvent();
            } catch (error) {
              utils.showAlert(error.message, 'error');
            }
          });
        }
      } catch (error) {
        container.innerHTML = `<p class="alert alert-error">${utils.escapeHtml(error.message)}</p>`;
      }
    }
    loadEvent();
  </script>
</body>
</html>
