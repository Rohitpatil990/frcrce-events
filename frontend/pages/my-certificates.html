<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Certificates - Event Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="header"><div class="container header-content">
    <div class="logo"><span class="logo-icon"><img src="../assets/college-logo.jpg" alt="FRCRCE Logo" class="college-logo"></span><span>FRCRCE Events</span></div>
    <nav><ul class="nav-links"><li><a href="student-dashboard.html">Browse Events</a></li><li><a href="my-registrations.html">My Registrations</a></li><li><a href="my-certificates.html">Certificates</a></li><li class="user-info"><span id="userName" class="user-name"></span><button class="btn btn-secondary btn-small" onclick="utils.logout()">Logout</button></li></ul></nav>
  </div></header>
  <main class="main-content"><div class="container"><section class="card">
    <div class="card-header"><h1 class="card-title">My Certificates</h1></div><div id="certificates"><div class="spinner"></div></div>
  </section></div></main>
  <script src="../js/api.js"></script>
  <script>
    if (!utils.checkAuth()) throw new Error('Authentication required');
    const user = utils.getUserFromStorage();
    if (user.role !== 'student') window.location.href = `/pages/${user.role}-dashboard.html`;
    document.getElementById('userName').textContent = user.name;
    async function loadCertificates() {
      const container = document.getElementById('certificates');
      try {
        const { certificates } = await certificateAPI.getMyCertificates();
        container.innerHTML = certificates.length ? `<div class="table-container"><table class="table">
          <thead><tr><th>Event</th><th>Certificate number</th><th>Issued</th><th>Download</th></tr></thead><tbody>
          ${certificates.map((certificate) => `<tr><td>${utils.escapeHtml(certificate.event?.title || 'Event unavailable')}</td>
            <td>${utils.escapeHtml(certificate.certificateNumber)}</td>
            <td>${utils.escapeHtml(utils.formatDate(certificate.issueDate))}</td>
            <td><button class="btn btn-primary btn-small" onclick="certificateAPI.downloadCertificate('${certificate._id}')">Download PDF</button></td></tr>`).join('')}
          </tbody></table></div>` : '<p>No certificates have been issued to you yet.</p>';
      } catch (error) {
        container.innerHTML = `<p class="alert alert-error">${utils.escapeHtml(error.message)}</p>`;
      }
    }
    loadCertificates();
  </script>
</body>
</html>
