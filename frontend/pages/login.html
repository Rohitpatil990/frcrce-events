<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Event Management System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="logo-icon">
          <img src="../assets/college-logo.jpg" alt="FRCRCE Logo" class="college-logo">
        </div>
        <h1>Event Management System</h1>
        <p>Fr. Conceicao Rodrigues College of Engineering</p>
      </div>

      <div id="alert-container"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Login
        </button>
      </form>

      <p class="mt-3 text-center" style="color: #6b7280; font-size: 0.875rem;">
        Contact your administrator if you need an account.
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Check if already logged in
    if (utils.isLoggedIn()) {
      const user = utils.getUserFromStorage();
      window.location.href = `/pages/${user.role}-dashboard.html`;
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        utils.showLoading();

        const response = await authAPI.login({ email, password });

        if (response.success) {
          // Save user data to localStorage
          utils.saveToLocalStorage('user', response.user);

          // Redirect based on role
          const role = response.user.role;
          window.location.href = `/pages/${role}-dashboard.html`;
        }
      } catch (error) {
        utils.hideLoading();
        
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-error';
        alertDiv.textContent = error.message || 'Login failed. Please check your credentials.';
        
        const alertContainer = document.getElementById('alert-container');
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alertDiv);
      }
    });
  </script>
</body>
</html>
